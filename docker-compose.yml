version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: presence
      POSTGRES_USER: presence_user
      POSTGRES_PASSWORD: presence_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence_user -d presence"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://presence_user:presence_password@postgres:5432/presence
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-here
      WHATSAPP_API_URL: https://api.whatsapp.com
      WHATSAPP_API_TOKEN: your-whatsapp-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://presence_user:presence_password@postgres:5432/presence
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-here
      WHATSAPP_API_URL: https://api.whatsapp.com
      WHATSAPP_API_TOKEN: your-whatsapp-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.services.scheduler worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://presence_user:presence_password@postgres:5432/presence
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-here
      WHATSAPP_API_URL: https://api.whatsapp.com
      WHATSAPP_API_TOKEN: your-whatsapp-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.services.scheduler beat --loglevel=info

  kiosk:
    build:
      context: ./frontend/kiosk
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api

  manager:
    build:
      context: ./frontend/manager
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api

  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api

volumes:
  postgres_data:
  redis_data: