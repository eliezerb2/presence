apiVersion: v2
name: presence-system
description: School Attendance Management System
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

keywords:
  - attendance
  - school
  - management
  - education

maintainers:
  - name: School IT Team
    email: it@school.edu