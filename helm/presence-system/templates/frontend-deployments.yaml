# Kiosk Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "presence-system.fullname" . }}-kiosk
  labels:
    {{- include "presence-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: kiosk
spec:
  replicas: {{ .Values.kiosk.replicaCount }}
  selector:
    matchLabels:
      {{- include "presence-system.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kiosk
  template:
    metadata:
      labels:
        {{- include "presence-system.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kiosk
    spec:
      containers:
        - name: kiosk
          image: "{{ .Values.kiosk.image.repository }}:{{ .Values.kiosk.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "presence-system.fullname" . }}-kiosk
  labels:
    {{- include "presence-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: kiosk
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.kiosk.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "presence-system.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kiosk

